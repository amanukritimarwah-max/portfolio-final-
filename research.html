var D=[{"id": "presence", "t": "Designing for Presence: How Walking Revives Streets", "sub": "Socially informed design for pedestrian safety", "v": "Design Theory and Research Methodology", "st": "Accepted for publication at ICoRD’27", "stage": 3, "tags": ["Urban interaction", "Walking behaviour", "Safety"], "facts": ["Vijayawada", "Hyderabad"], "pdf": "pdf/presence-walking.pdf", "ab": "Walking is one of the most accessible and health-supportive forms of urban mobility. Yet, in many Indian cities, it is frequently avoided due to uncertainty, perceived safety risks, and lack of social reassurance rather than distance alone. While the movement of vehicles receives ample measurement and optimisation, pedestrians' experiences, especially in environments that are viewed as isolated or unsafe, tend to be less conspicuous in daily navigation. This research seeks to explore the possibility of using the interface PRESENCE to capture environmental and social cues related to the sense of safety of pedestrians. The project analyses specific pedestrian environments in Vijayawada and Hyderabad in order to establish how pedestrians perceive the environment in terms of the level of lighting, presence of pedestrians, traffic flow, enclosure, and the time of the day. Based on these results, as well as knowledge from urban safety literature and pedestrian mobility and public health perspectives, the interface PRESENCE was designed. This interface involves the creation of a pedestrian-oriented map based on various cues, the presence of pedestrians, time patterns, and context-based inputs. It aims at capturing where pedestrians walk, when they walk, as well as what the environments mean to others. It looks into how the visualization of collective walking activity and social perception can help improve the process of route selection."}, {"id": "pradakshina", "t": "Pradakshina: Reimagining Temporal Experience", "sub": "Interface design for re-connecting with nature and culture", "v": "ICoRD 2027", "st": "Invited for conference", "stage": 3, "tags": ["Temporal interface", "Emotional design", "Lean UX"], "facts": ["n = 16 formative", "n = 38 evaluation"], "pdf": "pdf/pradakshina.pdf", "ab": "Time is commonly communicated through numerical representations, often separating everyday timekeeping from the natural cycles and cultural practices that have historically shaped its understanding. In Indian calendar systems, time is closely associated with lunar phases, seasonal transitions and culturally significant events. However, changing lifestyles and the increasing dependence on standardised digital time displays may be contributing to a gradual disconnect between people, natural rhythms and traditional temporal practices. This research explores whether human-centred product design can help reconnect these dimensions by integrating chronological, natural and cultural understandings of time within a unified interface. The central hypothesis proposes that integrating natural cycles and cultural references into conventional timekeeping, supported by principles of simplicity and emotional design, can encourage a more meaningful and culturally connected experience of time. Pradakshina is developed as a human-centred timekeeping concept that explores this relationship through a traditional wristwatch form. Its interface combines concentric rings, colour-coded indicators and digital elements to communicate multiple temporal scales, including lunar phases, annual cycles, hours, minutes and seconds, through six interconnected subcomponents. An exploratory mixed-method approach informed the research, incorporating product analysis, formative user research (n = 16) and product evaluation (n = 38). Descriptive statistical analysis was conducted on survey responses, while Cronbach’s alpha was used to assess the internal consistency of relevant evaluation scales. The design process was informed by Dieter Rams’ principles of Good Design and Don Norman’s theory of Emotional Design, establishing a theoretical relationship between functional simplicity, clarity and emotional engagement. Lean UX guided iterative concept development, visual exploration, user feedback and design refinement. The evaluation indicated an internal consistency value of α = 0.72 for the simplicity-related scale, suggesting acceptable reliability, while the emotional-design scale recorded α = 0.32, indicating low internal consistency. This difference raises questions about how contemporary lifestyles, established mental models of numerical timekeeping and changing relationships with nature and cultural traditions influence emotional responses to culturally embedded design. However, the limited sample size and exploratory nature of the study mean that these findings should be interpreted cautiously rather than treated as evidence of a definitive behavioural shift. The research proposes that timekeeping products can extend beyond numerical functionality to communicate relationships between natural rhythms, cultural identity and personal experience. Pradakshina offers an exploratory design framework for reconnecting these dimensions through product design. Further research using interactive prototypes, larger and more diverse samples, and task-based usability testing is required to investigate the usability, emotional relevance and long-term acceptance of the proposed interface."}, {"id": "pals", "t": "PalS: Tactile-First Pedagogy for Early Braille Acquisition", "sub": "In low-resource classrooms", "v": "DRS 2026 · Design with Care", "st": "Research paper submitted", "stage": 2, "tags": ["Tactile pedagogy", "Braille literacy", "Learner autonomy"], "facts": ["8-week pilot", "N = 24"], "pdf": "pdf/pals-drs2026.pdf", "ab": "Braille literacy remains critically low globally and especially in low-resource contexts such as India, where instruction often relies on costly digital tools or limited embossed materials that offer minimal tactile progression. PalS (Passive Adaptive Learning Slip) addresses this gap as a non-digital, tactile-first instructional system designed to reduce initial cognitive load through kinesthetic scaffolding. Using removable progression-based slips, a split tutor–learner board, and a mechanical self-checking overlay, PalS supports incremental practice and learner autonomy. Developed through a co-design process with learners and teachers, the approach responded to needs around pacing, error recognition, and motivation. An eight-week pilot with a mixed learner group (N = 24), from early beginners to Grade 9, showed improvements in tactile recognition, placement accuracy, and self-regulated correction. Rather than replacing existing methods, PalS complements current Braille pedagogy by offering a low-cost, repairable, and context-responsive pathway for strengthening foundational tactile literacy in resource-constrained environments."}, {"id": "heritage", "t": "Reimagine Vernacular Heritage Through Play", "sub": "A human-centred approach to serious board-game design", "v": "", "st": "Research in progress", "stage": 1, "tags": ["Serious games", "Experiential learning", "Heritage"], "facts": ["PRISMA review", "Octalysis"], "pdf": "pdf/vernacular-heritage-play.pdf", "ab": "Vernacular heritage encompasses traditional knowledge, cultural practices, craftsmanship and community narratives that are essential to cultural identity and intergenerational knowledge transmission. However, conventional educational and heritage interpretation approaches often rely on passive information delivery, offering limited opportunities for learners to actively engage with the processes, decisions and relationships underlying these practices. Similarly, serious games may incorporate educational content without meaningfully integrating learning objectives into their core gameplay. This research investigates how serious board games can transform complex heritage knowledge into meaningful experiential learning through interactive mechanics, storytelling, resource management, decision-making and player interaction. The study adopts a PRISMA-guided systematic literature review to examine existing research on experiential learning, serious games and heritage interpretation, identifying relevant design approaches and research gaps. The Octalysis Framework is used to analyse motivational elements in game design, while comparative game analysis informs the development of a serious board-game prototype. Through iterative prototyping and playtesting, the research will examine how game mechanics, narratives, resources, player decisions and feedback can connect learning objectives with engaging gameplay experiences. The expected outcome is an evaluated prototype serving as a proof of concept, alongside a set of design principles and an adaptable framework for integrating experiential learning into serious board games. The study aims to contribute to the development of engaging and culturally meaningful approaches to heritage interpretation and intergenerational knowledge transmission across diverse educational and cultural contexts."}];
